[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wormcheck"
version = "0.0.1"
description = "Independent mathematical audit of arXiv:2406.08250"
requires-python = ">=3.11"
dependencies = ["sympy>=1.13,<2", "mpmath>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
